; Sun6502 IDE - BASIC reference data
; One section per command:
;   [COMMAND NAME]
;   Syntax=how it is written
;   Description=what it does   (use \n for a line break)
; Lines starting with ; or # are comments. Save the file, then reopen the help window.
;
; Generic Microsoft 6502 BASIC is listed below. Not every ROM has every command,
; so check against your Sun6502 BASIC and delete or edit entries as needed.

[(your extra commands)]
Syntax=see commands.ini
Description=Add the extra commands of your Sun6502 BASIC to commands.ini in the program folder, one [section] per command, using the format described at the top of that file.

[PRINT]
Syntax=PRINT [expr] [; or ,] ...
Description=Prints values to the terminal. A semicolon keeps the cursor where it is, a comma jumps to the next print zone. A trailing semicolon suppresses the new line. Most MS BASICs accept ? as a shortcut.\n\nExample:\nPRINT "HELLO";A

[INPUT]
Syntax=INPUT ["prompt";] var [,var...]
Description=Waits for the user to type one or more values and stores them in the variables.\n\nExample:\nINPUT "NAME";N$

[BEEP]
Syntax=BEEP tone, length
Description=Makes the piezo beep.\n\ntone = 0-10000 (pitch value)\nlength = 0-255 (one byte)\n\nExample:\nBEEP 1000,50

[LCDCMD]
Syntax=LCDCMD n
Description=Sends the command byte n (0-255, decimal) to the 1602A (HD44780-compatible) LCD. Used for clearing, cursor, display on/off and cursor positioning. The most common codes are listed under LCDCMD codes.\n\nExample:\nLCDCMD 1 : REM clear screen\nLCDCMD 192 : REM cursor to start of line 2

[LCDCMD codes]
Syntax=LCDCMD n   (n in decimal)
Description=Standard HD44780 command bytes for a 1602A:\n\n1 = clear display, cursor home\n2 = cursor home\n4 = entry mode: cursor moves left\n6 = entry mode: cursor moves right (normal)\n5, 7 = as 4, 6 but the display shifts while writing\n8 = display off (text is kept)\n12 = display on, cursor off\n13 = display on, cursor off, blink\n14 = display on, underline cursor\n15 = display on, underline cursor + blink\n16 = move cursor left one position\n20 = move cursor right one position\n24 = shift whole display left\n28 = shift whole display right\n56 = function set: 8-bit, 2 lines, 5x8 font (normal for 1602)\n40 = function set: 4-bit, 2 lines\n64-127 = set character generator address (custom characters, 64 + 8 x char number)\n128-143 = cursor to line 1, column 0-15 (128 + column)\n192-207 = cursor to line 2, column 0-15 (192 + column)\n\nDo not change the function set (56 / 40) unless you know how the LCD is wired, or it may stop responding.\n\nExample:\nLCDCMD 128 : LCDPRINT "LINE 1"\nLCDCMD 192 : LCDPRINT "LINE 2"

[LCDPRINT]
Syntax=LCDPRINT string / number / variable
Description=Prints a string, a number or a variable to the LCD at the current cursor position.\n\nThere is no line wrap and no bounds checking: text longer than 16 characters runs off the right edge of the line and does not continue on the next line. Use LCDCMD to position the cursor first (128 = line 1, 192 = line 2) and keep text within 16 characters.\n\nExample:\nLCDCMD 1\nLCDPRINT "HELLO"\nA=42 : LCDPRINT A\nN$="SUN6502" : LCDPRINT N$

[LET]
Syntax=[LET] var = expr
Description=Assigns a value to a variable. The word LET is optional.\n\nExample:\nLET A=5\nA=A+1

[IF...THEN]
Syntax=IF condition THEN line / statement
Description=Runs the THEN part only when the condition is true. THEN followed by a number means GOTO that line.\n\nExample:\nIF A>10 THEN PRINT "BIG"\nIF A=0 THEN 100

[GOTO]
Syntax=GOTO line
Description=Continues execution at the given line number.\n\nExample:\nGOTO 100

[GOSUB]
Syntax=GOSUB line
Description=Calls a subroutine at the given line. Use RETURN to come back.\n\nExample:\nGOSUB 500

[RETURN]
Syntax=RETURN
Description=Returns from a GOSUB to the statement after it.\n\nExample:\n500 PRINT "SUB"\n510 RETURN

[ON...GOTO]
Syntax=ON expr GOTO line1,line2,...
Description=Jumps to the 1st, 2nd, 3rd... line depending on the value of expr. Also works with GOSUB.\n\nExample:\nON K GOTO 100,200,300

[FOR...NEXT]
Syntax=FOR var = start TO end [STEP n]\nNEXT [var]
Description=Repeats the statements between FOR and NEXT. STEP defaults to 1.\n\nExample:\nFOR I=1 TO 10 STEP 2\nPRINT I\nNEXT I

[NEXT]
Syntax=NEXT [var]
Description=Closes a FOR loop.\n\nExample:\nNEXT I

[DIM]
Syntax=DIM var(size) [,var(size)...]
Description=Reserves array space. Arrays without DIM default to 10 elements (0-10). Indexes start at 0.\n\nExample:\nDIM A(100),N$(20)

[DATA]
Syntax=DATA value [,value...]
Description=Holds constants that READ takes one by one. Strings with commas need quotes.\n\nExample:\nDATA 1,2,3,"HELLO"

[READ]
Syntax=READ var [,var...]
Description=Reads the next values from DATA statements into variables.\n\nExample:\nREAD A,B,N$

[RESTORE]
Syntax=RESTORE
Description=Resets the DATA pointer so READ starts again from the first DATA.\n\nExample:\nRESTORE

[REM]
Syntax=REM comment
Description=A remark. The rest of the line is ignored.\n\nExample:\n10 REM MAIN LOOP

[END]
Syntax=END
Description=Ends the program and returns to the prompt.\n\nExample:\nEND

[STOP]
Syntax=STOP
Description=Stops the program with a BREAK message. Continue with CONT.\n\nExample:\nSTOP

[POKE]
Syntax=POKE address, value
Description=Writes a byte (0-255) into memory or an I/O address.\n\nExample:\nPOKE 49152,65

[WAIT]
Syntax=WAIT address, mask [,xor]
Description=Waits until a memory or I/O location matches the bit pattern. The machine hangs if it never does.\n\nExample:\nWAIT 49153,1

[DEF FN]
Syntax=DEF FNx(var) = expr
Description=Defines a one-line user function. Call it as FNx(value).\n\nExample:\nDEF FNA(X)=X*X+1\nPRINT FNA(3)

[CLEAR]
Syntax=CLEAR
Description=Erases all variables and arrays.\n\nExample:\nCLEAR

[NULL]
Syntax=NULL n
Description=Sets the number of null characters sent after each line. Helps slow printers and terminals.\n\nExample:\nNULL 3

[LIST]
Syntax=LIST [first][-last]
Description=Lists the program, or a range of lines.\n\nExample:\nLIST\nLIST 100-200

[RUN]
Syntax=RUN [line]
Description=Clears variables and starts the program, from the first line or from the given line.\n\nExample:\nRUN

[NEW]
Syntax=NEW
Description=Deletes the program in memory.\n\nExample:\nNEW

[CONT]
Syntax=CONT
Description=Continues a program after STOP, END or Ctrl-C. Not possible if the program was changed.\n\nExample:\nCONT

[ABS]
Syntax=ABS(x)
Description=Absolute value.\n\nExample:\nPRINT ABS(-5)

[ATN]
Syntax=ATN(x)
Description=Arctangent in radians.\n\nExample:\nPRINT ATN(1)*4

[COS]
Syntax=COS(x)
Description=Cosine, x in radians.\n\nExample:\nPRINT COS(0)

[EXP]
Syntax=EXP(x)
Description=e raised to the power x.\n\nExample:\nPRINT EXP(1)

[FRE]
Syntax=FRE(0)
Description=Free memory in bytes. The argument is a dummy.\n\nExample:\nPRINT FRE(0)

[INT]
Syntax=INT(x)
Description=Rounds down to the nearest whole number.\n\nExample:\nPRINT INT(3.7)

[LOG]
Syntax=LOG(x)
Description=Natural logarithm.\n\nExample:\nPRINT LOG(10)

[POS]
Syntax=POS(0)
Description=Current cursor column.\n\nExample:\nPRINT POS(0)

[RND]
Syntax=RND(x)
Description=Random number between 0 and 1. In most MS BASICs a negative x seeds the generator and 0 repeats the last value.\n\nExample:\nPRINT INT(RND(1)*6)+1

[SGN]
Syntax=SGN(x)
Description=Sign of x: -1, 0 or 1.\n\nExample:\nPRINT SGN(-3)

[SIN]
Syntax=SIN(x)
Description=Sine, x in radians.\n\nExample:\nPRINT SIN(1)

[SQR]
Syntax=SQR(x)
Description=Square root.\n\nExample:\nPRINT SQR(16)

[TAN]
Syntax=TAN(x)
Description=Tangent, x in radians.\n\nExample:\nPRINT TAN(1)

[PEEK]
Syntax=PEEK(address)
Description=Reads a byte from memory or an I/O address.\n\nExample:\nPRINT PEEK(49152)

[USR]
Syntax=USR(x)
Description=Calls a machine code routine whose address is stored in the USR vector, and returns its result.\n\nExample:\nX=USR(0)

[LEN]
Syntax=LEN(a$)
Description=Length of a string.\n\nExample:\nPRINT LEN("HELLO")

[ASC]
Syntax=ASC(a$)
Description=Character code of the first character.\n\nExample:\nPRINT ASC("A")

[CHR$]
Syntax=CHR$(n)
Description=Character with code n.\n\nExample:\nPRINT CHR$(65)

[LEFT$]
Syntax=LEFT$(a$,n)
Description=The first n characters.\n\nExample:\nPRINT LEFT$("HELLO",2)

[RIGHT$]
Syntax=RIGHT$(a$,n)
Description=The last n characters.\n\nExample:\nPRINT RIGHT$("HELLO",2)

[MID$]
Syntax=MID$(a$,start [,n])
Description=n characters starting at position start (the first character is 1).\n\nExample:\nPRINT MID$("HELLO",2,3)

[STR$]
Syntax=STR$(x)
Description=Converts a number to a string.\n\nExample:\nA$=STR$(123)

[VAL]
Syntax=VAL(a$)
Description=Converts a string to a number.\n\nExample:\nPRINT VAL("12")+1

[TAB]
Syntax=TAB(n)
Description=Moves to column n. Only inside PRINT.\n\nExample:\nPRINT TAB(10);"X"

[SPC]
Syntax=SPC(n)
Description=Prints n spaces. Only inside PRINT.\n\nExample:\nPRINT "A";SPC(5);"B"

[Arithmetic]
Syntax=+  -  *  /  ^
Description=Add, subtract, multiply, divide, power. Precedence: ^ first, then * and /, then + and -.\n\nExample:\nPRINT 2+3*4^2

[Comparison]
Syntax==  <>  <  >  <=  >=
Description=Compares values. The result is -1 (true) or 0 (false).\n\nExample:\nIF A<>B THEN 100

[AND OR NOT]
Syntax=a AND b / a OR b / NOT a
Description=Logical and bitwise operators on 16-bit integers.\n\nExample:\nPRINT 12 AND 10\nIF A>1 AND B<5 THEN 100

[Variables]
Syntax=AB  A$  A(5)
Description=Only the first two characters of a name are significant. A trailing $ marks a string. Names must not contain BASIC keywords.\n\nExample:\nN$="HI":X=5

[LIST to file]
Syntax=Grab from terminal
Description=Type LIST on the computer, then press Grab from terminal to copy the listing into the editor and save it.
